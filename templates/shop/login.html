{% extends 'shop/base.html' %}
{% load i18n %}

{% block title %}{% translate "Log In" %} — Card Heroes{% endblock %}

{% block content %}
<div class="panel">
  <h1>{% translate "Log In" %}</h1>
  <form method="post" class="stacked">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-red" type="submit">{% translate "Log In" %}</button>
  </form>
  <p style="margin-top:1rem;">{% translate "New here?" %} <a href="{% url 'shop:register' %}">{% translate "Create an account" %}</a></p>
</div>
{% endblock %}
