<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <!-- Original manga-style panel collage background (epic adventure moments, drawn from scratch) -->
  <defs>
    <pattern id="halftone" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#222"/>
      <circle cx="9" cy="9" r="1.8" fill="#222"/>
    </pattern>
    <pattern id="halftoneLight" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.2" fill="#444"/>
      <circle cx="11" cy="11" r="1.2" fill="#444"/>
    </pattern>
    <g id="speedlines">
      <g stroke="#111" stroke-width="2">
        <line x1="0" y1="10" x2="400" y2="4"/><line x1="0" y1="40" x2="400" y2="30"/>
        <line x1="0" y1="75" x2="400" y2="62"/><line x1="0" y1="110" x2="400" y2="100"/>
        <line x1="0" y1="150" x2="400" y2="136"/><line x1="0" y1="190" x2="400" y2="176"/>
        <line x1="0" y1="230" x2="400" y2="214"/><line x1="0" y1="270" x2="400" y2="258"/>
      </g>
    </g>
  </defs>

  <rect width="1600" height="1200" fill="#f4f1e8"/>

  <!-- ============ PANEL 1: pirate ship on stormy sea ============ -->
  <g>
    <rect x="20" y="20" width="500" height="360" fill="#fff" stroke="#111" stroke-width="6"/>
    <clipPath id="p1"><rect x="26" y="26" width="488" height="348"/></clipPath>
    <g clip-path="url(#p1)">
      <rect x="26" y="26" width="488" height="200" fill="url(#halftoneLight)"/>
      <!-- big wave -->
      <path d="M26 250 Q90 180 150 240 Q170 200 200 230 Q210 250 230 235 Q300 170 360 250 Q400 200 460 245 L520 260 L520 380 L26 380 Z" fill="#111"/>
      <path d="M26 265 Q120 215 220 268 Q330 210 514 270 L514 380 L26 380 Z" fill="#fff" opacity="0.15"/>
      <!-- ship silhouette -->
      <g transform="translate(250,150)">
        <path d="M-90 60 Q0 95 90 60 L75 95 Q0 120 -75 95 Z" fill="#111"/>
        <rect x="-6" y="-60" width="8" height="120" fill="#111"/>
        <path d="M2 -55 Q60 -35 2 -5 Z" fill="#111"/>
        <rect x="-60" y="-40" width="6" height="100" fill="#111"/>
        <path d="M-54 -35 Q-20 -20 -54 0 Z" fill="#111"/>
        <!-- flag -->
        <path d="M2 -60 L40 -70 L2 -78 Z" fill="#111"/>
      </g>
      <!-- sun rays -->
      <g stroke="#111" stroke-width="3" opacity="0.6">
        <line x1="440" y1="40" x2="400" y2="90"/><line x1="470" y1="60" x2="425" y2="100"/><line x1="490" y1="95" x2="440" y2="115"/>
      </g>
      <circle cx="470" cy="55" r="26" fill="none" stroke="#111" stroke-width="4"/>
    </g>
  </g>

  <!-- ============ PANEL 2: punch with speed lines ============ -->
  <g>
    <rect x="545" y="20" width="440" height="240" fill="#fff" stroke="#111" stroke-width="6"/>
    <clipPath id="p2"><rect x="551" y="26" width="428" height="228"/></clipPath>
    <g clip-path="url(#p2)">
      <use href="#speedlines" x="560" y="20"/>
      <!-- stretched arm + fist -->
      <path d="M560 160 Q740 150 850 140" stroke="#111" stroke-width="22" fill="none" stroke-linecap="round"/>
      <circle cx="872" cy="138" r="34" fill="#111"/>
      <!-- impact burst -->
      <g fill="#111">
        <path d="M910 138 L965 120 L925 150 L975 158 L918 156 Z"/>
        <path d="M905 105 L940 60 L918 110 Z"/>
        <path d="M902 170 L945 210 L915 172 Z"/>
      </g>
      <text x="700" y="90" font-family="Impact, Arial Black, sans-serif" font-size="64" fill="#111" transform="rotate(-8 700 90)" opacity="0.9">DOOON!!</text>
    </g>
  </g>

  <!-- ============ PANEL 3: castle silhouette + fireworks ============ -->
  <g>
    <rect x="1010" y="20" width="570" height="240" fill="#111" stroke="#111" stroke-width="6"/>
    <clipPath id="p3"><rect x="1016" y="26" width="558" height="228"/></clipPath>
    <g clip-path="url(#p3)">
      <!-- fireworks -->
      <g stroke="#fff" stroke-width="2.5">
        <g transform="translate(1120,80)">
          <line x1="0" y1="0" x2="0" y2="-34"/><line x1="0" y1="0" x2="24" y2="-24"/><line x1="0" y1="0" x2="34" y2="0"/>
          <line x1="0" y1="0" x2="24" y2="24"/><line x1="0" y1="0" x2="0" y2="34"/><line x1="0" y1="0" x2="-24" y2="24"/>
          <line x1="0" y1="0" x2="-34" y2="0"/><line x1="0" y1="0" x2="-24" y2="-24"/>
        </g>
        <g transform="translate(1300,60) scale(0.7)">
          <line x1="0" y1="0" x2="0" y2="-34"/><line x1="0" y1="0" x2="24" y2="-24"/><line x1="0" y1="0" x2="34" y2="0"/>
          <line x1="0" y1="0" x2="24" y2="24"/><line x1="0" y1="0" x2="0" y2="34"/><line x1="0" y1="0" x2="-24" y2="24"/>
          <line x1="0" y1="0" x2="-34" y2="0"/><line x1="0" y1="0" x2="-24" y2="-24"/>
        </g>
      </g>
      <g fill="#fff"><circle cx="1200" cy="110" r="2"/><circle cx="1260" cy="90" r="2"/><circle cx="1420" cy="70" r="2"/><circle cx="1520" cy="120" r="2"/><circle cx="1060" cy="130" r="2"/></g>
      <!-- fairytale castle -->
      <g fill="#fff">
        <rect x="1360" y="140" width="120" height="114"/>
        <rect x="1385" y="100" width="18" height="60"/><path d="M1382 100 L1394 74 L1406 100 Z"/>
        <rect x="1437" y="100" width="18" height="60"/><path d="M1434 100 L1446 74 L1458 100 Z"/>
        <rect x="1408" y="80" width="24" height="80"/><path d="M1404 80 L1420 46 L1436 80 Z"/>
        <rect x="1412" y="200" width="16" height="54" fill="#111"/>
      </g>
      <text x="1040" y="230" font-family="Impact, Arial Black, sans-serif" font-size="42" fill="#fff" opacity="0.85">MAGIC!</text>
    </g>
  </g>

  <!-- ============ PANEL 4: determined eyes close-up ============ -->
  <g>
    <rect x="545" y="285" width="440" height="200" fill="#fff" stroke="#111" stroke-width="6"/>
    <clipPath id="p4"><rect x="551" y="291" width="428" height="188"/></clipPath>
    <g clip-path="url(#p4)">
      <rect x="551" y="291" width="428" height="188" fill="url(#halftoneLight)"/>
      <!-- brows + eyes -->
      <path d="M600 360 L720 340" stroke="#111" stroke-width="14" stroke-linecap="round"/>
      <path d="M930 360 L810 340" stroke="#111" stroke-width="14" stroke-linecap="round"/>
      <ellipse cx="670" cy="392" rx="34" ry="20" fill="#fff" stroke="#111" stroke-width="6"/>
      <ellipse cx="860" cy="392" rx="34" ry="20" fill="#fff" stroke="#111" stroke-width="6"/>
      <circle cx="674" cy="392" r="10" fill="#111"/>
      <circle cx="856" cy="392" r="10" fill="#111"/>
      <!-- scar under eye -->
      <path d="M640 420 L660 424 M648 414 L652 430" stroke="#111" stroke-width="3"/>
    </g>
  </g>

  <!-- ============ PANEL 5: treasure chest ============ -->
  <g>
    <rect x="1010" y="285" width="270" height="200" fill="#fff" stroke="#111" stroke-width="6"/>
    <clipPath id="p5"><rect x="1016" y="291" width="258" height="188"/></clipPath>
    <g clip-path="url(#p5)">
      <!-- radiating glory lines -->
      <g stroke="#111" stroke-width="2">
        <line x1="1145" y1="380" x2="1030" y2="300"/><line x1="1145" y1="380" x2="1090" y2="292"/>
        <line x1="1145" y1="380" x2="1145" y2="291"/><line x1="1145" y1="380" x2="1200" y2="292"/>
        <line x1="1145" y1="380" x2="1260" y2="300"/>
      </g>
      <g>
        <rect x="1085" y="380" width="120" height="70" fill="#111"/>
        <path d="M1085 380 Q1145 330 1205 380 Z" fill="#111"/>
        <rect x="1085" y="374" width="120" height="12" fill="#fff" stroke="#111" stroke-width="3"/>
        <circle cx="1145" cy="380" r="10" fill="#fff" stroke="#111" stroke-width="3"/>
        <!-- coins -->
        <circle cx="1120" cy="368" r="7" fill="#fff" stroke="#111" stroke-width="3"/>
        <circle cx="1168" cy="364" r="7" fill="#fff" stroke="#111" stroke-width="3"/>
        <circle cx="1145" cy="356" r="7" fill="#fff" stroke="#111" stroke-width="3"/>
      </g>
    </g>
  </g>

  <!-- ============ PANEL 6: mouse hero flying ============ -->
  <g>
    <rect x="1305" y="285" width="275" height="200" fill="#fff" stroke="#111" stroke-width="6"/>
    <clipPath id="p6"><rect x="1311" y="291" width="263" height="188"/></clipPath>
    <g clip-path="url(#p6)">
      <g stroke="#111" stroke-width="2" opacity="0.7">
        <line x1="1311" y1="320" x2="1574" y2="300"/><line x1="1311" y1="360" x2="1574" y2="336"/>
        <line x1="1311" y1="400" x2="1574" y2="372"/><line x1="1311" y1="440" x2="1574" y2="412"/>
      </g>
      <!-- caped mouse silhouette flying -->
      <g transform="translate(1430,380) rotate(-12)" fill="#111">
        <ellipse cx="0" cy="0" rx="34" ry="16"/>
        <circle cx="38" cy="-8" r="14"/>
        <circle cx="46" cy="-20" r="7"/><circle cx="30" cy="-22" r="7"/>
        <path d="M-30 -6 L-90 -30 L-60 4 L-96 16 L-30 8 Z"/>
        <path d="M-34 4 Q-70 20 -60 40" stroke="#111" stroke-width="4" fill="none"/>
        <rect x="46" y="-4" width="26" height="7" rx="3.5"/>
      </g>
    </g>
  </g>

  <!-- ============ PANEL 7: giant sea monster ============ -->
  <g>
    <rect x="20" y="405" width="500" height="330" fill="#fff" stroke="#111" stroke-width="6"/>
    <clipPath id="p7"><rect x="26" y="411" width="488" height="318"/></clipPath>
    <g clip-path="url(#p7)">
      <rect x="26" y="411" width="488" height="318" fill="url(#halftoneLight)"/>
      <!-- tentacles -->
      <g fill="#111">
        <path d="M60 729 Q40 600 110 560 Q160 535 150 480 Q145 445 110 440 Q90 438 85 460 Q82 478 100 482 Q88 500 70 488 Q45 470 60 430 Q80 395 130 405 Q190 420 185 490 Q180 560 130 590 Q90 620 100 729 Z"/>
        <path d="M240 729 Q220 620 280 570 Q330 525 310 470 Q295 435 260 445 Q245 452 250 470 Q230 470 232 445 Q240 410 290 418 Q350 432 345 500 Q338 570 290 610 Q260 640 270 729 Z"/>
        <path d="M420 729 Q400 640 450 590 Q495 545 480 500 Q470 470 445 478 Q430 485 438 500 Q420 505 418 480 Q420 450 460 452 Q510 458 508 520 Q505 580 465 625 Q440 655 450 729 Z"/>
      </g>
      <!-- tiny boat -->
      <path d="M180 700 Q220 715 260 700 L252 715 Q220 725 188 715 Z" fill="#111"/>
      <rect x="217" y="660" width="5" height="45" fill="#111"/>
      <text x="60" y="470" font-family="Impact, Arial Black, sans-serif" font-size="44" fill="#111" transform="rotate(-6 60 470)">GRAAAH!</text>
    </g>
  </g>

  <!-- ============ PANEL 8: toast / celebration ============ -->
  <g>
    <rect x="545" y="510" width="440" height="225" fill="#fff" stroke="#111" stroke-width="6"/>
    <clipPath id="p8"><rect x="551" y="516" width="428" height="213"/></clipPath>
    <g clip-path="url(#p8)">
      <!-- radial celebration lines -->
      <g stroke="#111" stroke-width="2" opacity="0.5">
        <line x1="765" y1="620" x2="600" y2="520"/><line x1="765" y1="620" x2="930" y2="520"/>
        <line x1="765" y1="620" x2="560" y2="620"/><line x1="765" y1="620" x2="970" y2="620"/>
      </g>
      <!-- clinking mugs -->
      <g fill="#fff" stroke="#111" stroke-width="6">
        <path d="M660 580 L672 660 L730 660 L740 580 Z"/>
        <path d="M870 580 L860 660 L802 660 L792 580 Z"/>
      </g>
      <!-- foam -->
      <g fill="#111">
        <circle cx="672" cy="576" r="9"/><circle cx="694" cy="570" r="11"/><circle cx="718" cy="574" r="9"/><circle cx="734" cy="580" r="7"/>
        <circle cx="800" cy="578" r="9"/><circle cx="822" cy="570" r="11"/><circle cx="846" cy="574" r="9"/><circle cx="862" cy="580" r="7"/>
      </g>
      <text x="620" y="710" font-family="Impact, Arial Black, sans-serif" font-size="42" fill="#111">KANPAI!!</text>
    </g>
  </g>

  <!-- ============ PANEL 9: wanted poster wall ============ -->
  <g>
    <rect x="1010" y="510" width="570" height="225" fill="#fff" stroke="#111" stroke-width="6"/>
    <clipPath id="p9"><rect x="1016" y="516" width="558" height="213"/></clipPath>
    <g clip-path="url(#p9)">
      <rect x="1016" y="516" width="558" height="213" fill="url(#halftoneLight)"/>
      <g transform="rotate(-4 1120 620)">
        <rect x="1050" y="540" width="130" height="170" fill="#fff" stroke="#111" stroke-width="5"/>
        <text x="1064" y="572" font-family="Impact, Arial Black, sans-serif" font-size="26" fill="#111">WANTED</text>
        <rect x="1066" y="584" width="98" height="70" fill="#111"/>
        <ellipse cx="1115" cy="622" rx="26" ry="18" fill="#fff"/>
        <circle cx="1096" cy="600" r="9" fill="#fff"/><circle cx="1134" cy="600" r="9" fill="#fff"/>
        <text x="1062" y="686" font-family="Impact, Arial Black, sans-serif" font-size="20" fill="#111">฿ 3,000,000</text>
      </g>
      <g transform="rotate(3 1330 620)">
        <rect x="1265" y="540" width="130" height="170" fill="#fff" stroke="#111" stroke-width="5"/>
        <text x="1279" y="572" font-family="Impact, Arial Black, sans-serif" font-size="26" fill="#111">WANTED</text>
        <rect x="1281" y="584" width="98" height="70" fill="#111"/>
        <circle cx="1330" cy="618" r="20" fill="#fff"/>
        <path d="M1310 600 Q1330 580 1350 600" fill="#fff"/>
        <text x="1277" y="686" font-family="Impact, Arial Black, sans-serif" font-size="20" fill="#111">฿ 5,000,000</text>
      </g>
      <g transform="rotate(-2 1500 620)">
        <rect x="1440" y="540" width="130" height="170" fill="#fff" stroke="#111" stroke-width="5"/>
        <text x="1454" y="572" font-family="Impact, Arial Black, sans-serif" font-size="26" fill="#111">WANTED</text>
        <rect x="1456" y="584" width="98" height="70" fill="#111"/>
        <ellipse cx="1505" cy="626" rx="24" ry="14" fill="#fff"/>
        <path d="M1487 606 L1497 590 L1505 606 M1505 606 L1515 590 L1523 606" stroke="#fff" stroke-width="4" fill="none"/>
        <text x="1452" y="686" font-family="Impact, Arial Black, sans-serif" font-size="20" fill="#111">฿ 9,999,999</text>
      </g>
    </g>
  </g>

  <!-- ============ PANEL 10: shouting to the sky ============ -->
  <g>
    <rect x="20" y="760" width="440" height="420" fill="#fff" stroke="#111" stroke-width="6"/>
    <clipPath id="p10"><rect x="26" y="766" width="428" height="408"/></clipPath>
    <g clip-path="url(#p10)">
      <!-- radial burst from mouth -->
      <g stroke="#111" stroke-width="3">
        <line x1="240" y1="1000" x2="60" y2="800"/><line x1="240" y1="1000" x2="160" y2="775"/>
        <line x1="240" y1="1000" x2="280" y2="770"/><line x1="240" y1="1000" x2="390" y2="790"/>
        <line x1="240" y1="1000" x2="440" y2="880"/><line x1="240" y1="1000" x2="40" y2="920"/>
      </g>
      <!-- head thrown back shouting -->
      <g fill="#111">
        <path d="M170 1180 Q160 1080 200 1030 Q230 995 270 1010 Q310 1030 300 1080 Q295 1120 310 1180 Z"/>
        <circle cx="250" cy="990" r="46"/>
        <path d="M262 950 Q300 930 306 962 Q308 985 284 990 Z"/>
      </g>
      <ellipse cx="262" cy="1002" rx="16" ry="20" fill="#fff"/>
      <text x="60" y="860" font-family="Impact, Arial Black, sans-serif" font-size="56" fill="#111" transform="rotate(-10 60 860)">I'M GONNA BE</text>
      <text x="90" y="930" font-family="Impact, Arial Black, sans-serif" font-size="72" fill="#111" transform="rotate(-10 90 930)">KING!!!</text>
    </g>
  </g>

  <!-- ============ PANEL 11: running crew silhouettes ============ -->
  <g>
    <rect x="485" y="760" width="640" height="200" fill="#fff" stroke="#111" stroke-width="6"/>
    <clipPath id="p11"><rect x="491" y="766" width="628" height="188"/></clipPath>
    <g clip-path="url(#p11)">
      <g stroke="#111" stroke-width="2" opacity="0.6">
        <line x1="491" y1="800" x2="1119" y2="786"/><line x1="491" y1="840" x2="1119" y2="822"/>
        <line x1="491" y1="880" x2="1119" y2="860"/><line x1="491" y1="920" x2="1119" y2="900"/>
      </g>
      <!-- runners -->
      <g fill="#111">
        <g transform="translate(600,880)">
          <circle cx="0" cy="-52" r="16"/><path d="M-8 -38 L10 -36 L16 0 L2 2 L8 30 L-6 32 L-12 4 L-26 28 L-38 20 L-20 -6 Z"/>
          <path d="M8 -34 L36 -24 L32 -14 L4 -24 Z"/>
        </g>
        <g transform="translate(750,884) scale(0.9)">
          <circle cx="0" cy="-52" r="16"/><path d="M-8 -38 L10 -36 L16 0 L2 2 L8 30 L-6 32 L-12 4 L-26 28 L-38 20 L-20 -6 Z"/>
          <path d="M-8 -36 L-38 -30 L-34 -18 L-6 -26 Z"/>
        </g>
        <g transform="translate(900,880) scale(1.05)">
          <circle cx="0" cy="-52" r="16"/><path d="M0 -68 L-14 -56 L14 -56 Z"/>
          <path d="M-8 -38 L10 -36 L16 0 L2 2 L8 30 L-6 32 L-12 4 L-26 28 L-38 20 L-20 -6 Z"/>
        </g>
        <g transform="translate(1030,886) scale(0.85)">
          <circle cx="0" cy="-52" r="16"/><circle cx="-12" cy="-64" r="6"/><circle cx="12" cy="-64" r="6"/>
          <path d="M-8 -38 L10 -36 L16 0 L2 2 L8 30 L-6 32 L-12 4 L-26 28 L-38 20 L-20 -6 Z"/>
        </g>
      </g>
      <text x="520" y="808" font-family="Impact, Arial Black, sans-serif" font-size="36" fill="#111" opacity="0.85">ADVENTURE AWAITS!</text>
    </g>
  </g>

  <!-- ============ PANEL 12: halftone burst + lightning ============ -->
  <g>
    <rect x="1150" y="760" width="430" height="200" fill="#111" stroke="#111" stroke-width="6"/>
    <clipPath id="p12"><rect x="1156" y="766" width="418" height="188"/></clipPath>
    <g clip-path="url(#p12)">
      <path d="M1300 766 L1260 850 L1310 845 L1250 954 L1340 860 L1295 862 L1345 766 Z" fill="#fff"/>
      <path d="M1450 766 L1420 830 L1458 826 L1415 920 L1488 838 L1450 840 L1490 766 Z" fill="#fff" opacity="0.7"/>
      <text x="1330" y="920" font-family="Impact, Arial Black, sans-serif" font-size="52" fill="#fff" transform="rotate(-5 1330 920)">KRAKOOM!</text>
    </g>
  </g>

  <!-- ============ PANEL 13: sunset sail ============ -->
  <g>
    <rect x="485" y="985" width="640" height="195" fill="#fff" stroke="#111" stroke-width="6"/>
    <clipPath id="p13"><rect x="491" y="991" width="628" height="183"/></clipPath>
    <g clip-path="url(#p13)">
      <circle cx="805" cy="1120" r="90" fill="none" stroke="#111" stroke-width="5"/>
      <g stroke="#111" stroke-width="3">
        <line x1="491" y1="1120" x2="700" y2="1120"/><line x1="910" y1="1120" x2="1119" y2="1120"/>
        <line x1="491" y1="1140" x2="1119" y2="1140"/><line x1="491" y1="1160" x2="1119" y2="1160"/>
      </g>
      <!-- small ship sailing into sun -->
      <g transform="translate(805,1108) scale(0.6)" fill="#111">
        <path d="M-60 30 Q0 55 60 30 L48 60 Q0 75 -48 60 Z"/>
        <rect x="-4" y="-50" width="7" height="80"/>
        <path d="M3 -46 Q45 -28 3 -6 Z"/>
      </g>
      <rect x="491" y="991" width="628" height="60" fill="url(#halftoneLight)"/>
    </g>
  </g>

  <!-- ============ PANEL 14: sparkle / pixie dust ============ -->
  <g>
    <rect x="1150" y="985" width="430" height="195" fill="#fff" stroke="#111" stroke-width="6"/>
    <clipPath id="p14"><rect x="1156" y="991" width="418" height="183"/></clipPath>
    <g clip-path="url(#p14)">
      <rect x="1156" y="991" width="418" height="183" fill="url(#halftoneLight)"/>
      <!-- wand trail -->
      <path d="M1180 1150 Q1300 1020 1550 1040" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
      <g fill="#111">
        <path d="M1250 1090 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z"/>
        <path d="M1340 1050 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z"/>
        <path d="M1440 1040 l7 16 16 7 -16 7 -7 16 -7 -16 -16 -7 16 -7 Z"/>
        <path d="M1500 1090 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
        <circle cx="1290" cy="1130" r="3"/><circle cx="1390" cy="1080" r="3"/><circle cx="1470" cy="1120" r="3"/>
      </g>
      <text x="1180" y="1050" font-family="Georgia, serif" font-style="italic" font-size="30" fill="#111">believe...</text>
    </g>
  </g>

  <!-- gutter cross-hatching accents -->
  <g stroke="#111" stroke-width="1" opacity="0.15">
    <line x1="0" y1="395" x2="1600" y2="395"/>
    <line x1="0" y1="748" x2="1600" y2="748"/>
    <line x1="530" y1="0" x2="530" y2="1200"/>
  </g>
</svg>
